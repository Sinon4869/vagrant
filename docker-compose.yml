services:
  postgres:
    image: postgres:16
    container_name: vagrant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vagrant
      POSTGRES_PASSWORD: vagrant
      POSTGRES_DB: vagrant
    ports:
      - "5432:5432"
    volumes:
      - vagrant-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagrant -d vagrant"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vagrant-postgres-data:
